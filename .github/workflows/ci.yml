name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cold-install:
    name: Cold install + run (no HF token, clean machine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install boxdawn the way the README says (cold, no cache)
        run: pip install .
      - name: Run boxdawn analyze without HF token
        env:
          HF_TOKEN: ""
          HUGGINGFACE_HUB_TOKEN: ""
        run: |
          boxdawn analyze examples/sample_otel_trace.json | tee /tmp/report.txt
          echo "exit code: ${PIPESTATUS[0]}"
      - name: Assert report produced
        run: |
          grep -q "Boxdawn Waste Report" /tmp/report.txt || (echo "report generation failed" && exit 1)
          echo "cold start OK: install + run + report with no token"

  tests:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with dev extra
        run: pip install ".[dev]"
      # Lint before the suite: a syntax error or an undefined name is cheaper to
      # read from ruff than from a collection error six minutes in. `F` and `E9`
      # only -- the selection and the reasons for what is left out are in
      # pyproject.toml.
      - name: Lint (ruff)
        run: ruff check
      - name: Run pytest
        run: pytest -q

  tests-adapter:
    name: Test suite ([adapter] extra)
    # The two jobs above install `.[dev]` only, which leaves out langchain-core,
    # langgraph and opentelemetry. Five test files skip at import without them,
    # among them the whole of `tests/autofix/` -- so `clew.autofix`, which ships
    # in the wheel, has had no line run in CI, and the adapter floor in
    # `test_suite_floor.py` has never been checked here. The `.[dev]` jobs stay
    # as they are: they show the suite holds without the extra.
    #
    # The seven tests deselected below embed text with the [semantic] model,
    # which this job does not install. They pass locally only because a
    # gitignored `.cache/embeddings/embeddings.sqlite` already holds the
    # vectors; without it they fail on `import torch`. They run in the
    # [semantic] job below instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with dev and adapter extras
        run: pip install ".[dev,adapter]"
      - name: Run pytest
        run: >-
          pytest -q -rs
          --deselect tests/test_field_regressions.py::test_r1_clean_no_false_fire
          --deselect tests/test_field_regressions.py::test_r2_repeat_node_true_positive
          --deselect tests/test_field_regressions.py::test_r3_router_adversarial_no_false_fire
          --deselect tests/test_field_regressions.py::test_r4_json_extraction_reduces_cosine
          --deselect tests/test_report_cli.py::test_d1_waste_report_contains_key_fields
          --deselect tests/test_report_cli.py::test_d2_clean_report_no_waste
          --deselect tests/test_report_cli.py::test_d3_serialization_roundtrip

  tests-semantic:
    name: Test suite ([semantic] extra)
    # The seven tests the adapter job deselects. They embed text with the
    # [semantic] model, and the hosted analyzer runs that model on every trace
    # that has waste to report (`_build_details` in `__main__.py`), so this is a
    # live path. Locally a gitignored `.cache/embeddings` had been answering
    # for the model; on a clean runner the model has to load and compute.
    runs-on: ubuntu-latest
    env:
      HF_HOME: ${{ github.workspace }}/.hf-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CPU-only wheel first, as the hosted image does: the default torch pulls
      # the CUDA stack, which nothing here uses.
      - name: Install CPU torch
        run: pip install "torch>=2.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Install with dev, adapter and semantic extras
        run: pip install ".[dev,adapter,semantic]"
      # Keyed on the pinned revision in src/clew/__main__.py (_REV), so a model
      # bump downloads afresh rather than reusing the old weights.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: .hf-home
          key: hf-paraphrase-multilingual-MiniLM-L12-v2-e8f8c211226b894fcb81acc59f3b34ba3efd5f42
      - name: Run the semantic tests
        run: >-
          pytest -q -rs
          tests/test_field_regressions.py::test_r1_clean_no_false_fire
          tests/test_field_regressions.py::test_r2_repeat_node_true_positive
          tests/test_field_regressions.py::test_r3_router_adversarial_no_false_fire
          tests/test_field_regressions.py::test_r4_json_extraction_reduces_cosine
          tests/test_report_cli.py::test_d1_waste_report_contains_key_fields
          tests/test_report_cli.py::test_d2_clean_report_no_waste
          tests/test_report_cli.py::test_d3_serialization_roundtrip

  tests-windows:
    name: Test suite (Windows)
    # The suite has a Windows-only test and it has never run anywhere. `schtasks
    # /XML` reads UTF-16 and rejects a UTF-8 file as malformed, which would leave
    # the sweep unregistered while `install` reported it as an XML problem --
    # that is what the test distinguishes, and on ubuntu it is skipped, so the
    # guard has been passing by not running since the day it was written.
    #
    # It also matters that the whole suite runs here: this is the only platform
    # the scheduler, the paths and the file locking are written for, and every
    # measurement in docs/ was produced on it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with dev extra
        run: pip install ".[dev]"
      - name: Lint (ruff)
        run: ruff check
      - name: Run pytest
        run: pytest -q
